services:

  app:
    image: sumaiya1/contact-manager:1.1
    container_name: contact-manager-app
    ports:
      - "5000:5000"

  prometheus:
    image: prom/prometheus:latest
    container_name: contact-manager-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: contact-manager-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus