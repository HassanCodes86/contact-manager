<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Manager Directory</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 30px; }
    .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; }
    .title h1 { margin: 0; color: #2c3e50; font-size: 24px; }
    .badge { padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
    .badge-ok { background-color: #d4edda; color: #155724; }
    
    .controls { display: flex; gap: 10px; margin: 20px 0; }
    .search-bar { flex: 1; padding: 10px 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-primary { background-color: #007bff; color: white; }
    .btn-primary:hover { background-color: #0056b3; }
    
    .add-form { display: flex; gap: 10px; margin-bottom: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; }
    .add-form input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background-color: #f8f9fa; color: #495057; }
    tr:hover { background-color: #f1f3f5; }
    .count-tag { font-size: 14px; color: #6c757d; font-weight: normal; }
  </style>
</head>
<body>

<div class="container">
  <!-- Header with Health Status -->
  <div class="header">
    <div class="title">
      <h1>📇 Contact Manager <span class="count-tag" id="contactCount">(0 contacts)</span></h1>
    </div>
    <div id="healthBadge" class="badge badge-ok">API Status: Checking...</div>
  </div>

  <!-- Add Contact Form -->
  <div class="add-form">
    <input type="text" id="newName" placeholder="Contact Name" required>
    <input type="text" id="newPhone" placeholder="Phone Number" required>
    <button class="btn btn-primary" onclick="addContact()">Add Contact</button>
  </div>

  <!-- Search Bar -->
  <div class="controls">
    <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search by Name or ID..." oninput="searchContacts()">
  </div>

  <!-- Contacts Table -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Phone Number</th>
      </tr>
    </thead>
    <tbody id="contactTableBody">
      <!-- Dynamic rows inserted here -->
    </tbody>
  </table>
</div>

<script>
  // 1. Fetch Health Status on load
  async function checkHealth() {
    try {
      const res = await fetch('/health');
      const data = await res.json();
      if(data.status === 'OK') {
        document.getElementById('healthBadge').innerText = 'System Health: OK 🟢';
      }
    } catch (err) {
      document.getElementById('healthBadge').innerText = 'API Offline 🔴';
      document.getElementById('healthBadge').style.background = '#f8d7da';
      document.getElementById('healthBadge').style.color = '#721c24';
    }
  }

  // 2. Load all contacts
  async function loadContacts() {
    const res = await fetch('/items');
    const data = await res.json();
    renderTable(data);
  }

  // 3. Live Search by Name or ID
  async function searchContacts() {
    const query = document.getElementById('searchInput').value;
    const res = await fetch(`/items/search?query=${encodeURIComponent(query)}`);
    const data = await res.json();
    renderTable(data);
  }

  // 4. Add New Contact (POST Request)
  async function addContact() {
    const name = document.getElementById('newName').value;
    const phone = document.getElementById('newPhone').value;

    if (!name || !phone) {
      alert("Please enter both name and phone number");
      return;
    }

    const res = await fetch('/items', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, phone })
    });

    if (res.ok) {
      document.getElementById('newName').value = '';
      document.getElementById('newPhone').value = '';
      loadContacts(); // Refresh list
    } else {
      alert("Failed to add contact");
    }
  }

  // Render Rows in Table
  function renderTable(contacts) {
    const tbody = document.getElementById('contactTableBody');
    document.getElementById('contactCount').innerText = `(${contacts.length} contacts)`;
    tbody.innerHTML = '';

    if(contacts.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#888;">No contacts found</td></tr>';
      return;
    }

    contacts.forEach(c => {
      const row = `<tr>
        <td><strong>#${c.id}</strong></td>
        <td>${c.name}</td>
        <td>${c.phone}</td>
      </tr>`;
      tbody.innerHTML += row;
    });
  }

  // Initial load
  checkHealth();
  loadContacts();
</script>

</body>
</html>
